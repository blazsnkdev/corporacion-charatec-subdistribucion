
<dialog
  #dialog
  class="popup-dialog"
  aria-labelledby="popup-title"
  aria-describedby="popup-message"
  (cancel)="cancelarEvento($event)">

  @if (popupService.popup(); as popup) {

    <div class="popup-content">

      <button
        type="button"
        class="close-button"
        aria-label="Cerrar ventana"
        (click)="cancelar()">

        ✕

      </button>

      <div
        class="popup-icon"
        [attr.data-type]="popup.type">

        <svg
          viewBox="0 0 24 24"
          width="40"
          height="40"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round">

          @switch (popup.type) {

            @case ('success') {
              <circle cx="12" cy="12" r="9"/>
              <path d="m8 12 3 3 5-6"/>
            }

            @case ('error') {
              <circle cx="12" cy="12" r="9"/>
              <path d="m9 9 6 6M15 9l-6 6"/>
            }

            @case ('warning') {
              <path d="M12 3 2 21h20L12 3z"/>
              <path d="M12 9v5M12 17h.01"/>
            }

            @case ('info') {
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 11v5M12 8h.01"/>
            }

            @default {
              <circle cx="12" cy="12" r="9"/>
              <path d="M9 9a3 3 0 1 1 5 2.2c-1.3.9-2 1.2-2 3"/>
              <path d="M12 17h.01"/>
            }

          }

        </svg>

      </div>

      <h2 id="popup-title">
        {{ popup.title }}
      </h2>

      <p id="popup-message">
        {{ popup.message }}
      </p>

      <div class="popup-actions">

        @if (popup.showCancel) {

          <button
            type="button"
            class="btn-cancel"
            autofocus
            (click)="cancelar()">

            {{ popup.cancelText || 'Cancelar' }}

          </button>

        }

        <button
          type="button"
          class="btn-confirm"
          [attr.data-type]="popup.type"
          (click)="confirmar()">

          {{ popup.confirmText || 'Aceptar' }}

        </button>

      </div>

    </div>

  }

</dialog>
