
<section class="pending-page">

  <div class="pending-card">

    <div class="status-icon">

      <svg
        width="35"
        height="35"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8">

        <circle cx="12" cy="12" r="9"/>

        <path d="M12 7v5l3 2"/>

      </svg>

    </div>

    <span class="eyebrow">
      CORPORACIÓN CHARATEC B2B
    </span>

    <h1>
      {{ authService.status() === 'blocked'
        ? 'Acceso bloqueado'
        : 'Solicitud pendiente' }}
    </h1>

    <p>
      Tu cuenta necesita autorización de nuestro
      equipo comercial para ingresar al catálogo.
    </p>

    <p class="account">
      {{ authService.user() }}
    </p>

    @if (message()) {

      <p role="status">
        {{ message() }}
      </p>

    }

    <a
      class="whatsapp"
      href="https://wa.me/51943771361"
      target="_blank"
      rel="noopener noreferrer">

      Consultar por WhatsApp

    </a>

    <button
      type="button"
      [disabled]="busy()"
      (click)="actualizarEstado()">

      {{ busy()
        ? 'Consultando...'
        : 'Actualizar estado' }}

    </button>

  </div>

</section>
